<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak & Alamat - Restoran Tanjung Pinang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
        }

        /* Navigasi */
        header {
            background-color: #222;
            padding: 15px 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav ul li a:hover,
        nav ul li a.active {
            color: #ff9800;
        }

        /* Konten Utama */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .contact-card {
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #ddd;
        }

        h1 {
            color: #1b365d;
            margin-bottom: 25px;
            font-size: 26px;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 12px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 15px;
            color: #333;
        }

        .contact-info p {
            line-height: 1.6;
        }

        .contact-info strong {
            color: #1b365d;
        }
    </style>
</head>
<body>

    <!-- Navigasi Bar -->
    <header>
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="profil.html">PROFIL</a></li>
                <li><a href="menu.html">MENU</a></li>
                <li><a href="registrasi.html">REGISTRASI</a></li>
                <li><a href="kontak.html" class="active">KONTAK</a></li>
            </ul>
        </nav>
    </header>

    <!-- Konten Halaman Kontak / Alamat -->
    <div class="container">
        <div class="contact-card">
            <h1>Informasi & Alamat Restoran</h1>
            
            <div class="contact-info">
                <p><strong>Alamat:</strong> Jl. Kuliner Nusantara No. 123, Jakarta Selatan</p>
                <p><strong>Jam Operasional:</strong> Setiap Hari (10.00 – 22.00 WIB)</p>
                <p><strong>Telepon / WhatsApp:</strong> 0812-3456-7890</p>
